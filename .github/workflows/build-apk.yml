name: ORION APK erstellen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: ZIP entpacken
        run: |
          mkdir orion
          unzip -q ORION-API-repariert.zip -d orion

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle installieren
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: APK bauen
        working-directory: orion/distribution/native/android
        run: gradle --no-daemon assembleDebug

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: ORION-apk
          path: orion/distribution/native/android/app/build/outputs/apk/debug/app-debug.apk
