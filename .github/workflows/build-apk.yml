name: Build ORION APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code herunterladen
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: APK bauen
        working-directory: distribution/native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: ORION-apk
          path: distribution/native/android/app/build/outputs/apk/debug/*.apk
